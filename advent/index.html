<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Troy’s Christmas Advent Calendar | American Tree Colorado</title>
<style>
:root{color-scheme:dark;--gold:#efc985;--ink:#fff3d8;--muted:#ddd4bd}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#244d3c,#0b211b 65%);color:var(--ink);font:1rem/1.55 system-ui,sans-serif;min-height:100vh}
main{max-width:1050px;margin:auto;padding:clamp(16px,4vw,42px)}
header{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr auto;align-items:end;background:radial-gradient(ellipse at 82% 72%,#496c4d,#15362a 64%);border:1px solid #ab8652;border-radius:22px;overflow:hidden}
.intro{padding:clamp(20px,5vw,52px)}
.brand{color:var(--gold);font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1,h2,.number{font-family:Georgia,serif}h1{font-size:clamp(2.2rem,7vw,5rem);line-height:.98;margin:.25em 0}h2{margin-bottom:0}
p{color:var(--muted)}.troy{width:clamp(110px,23vw,246px);height:auto;display:block;margin-right:clamp(8px,3vw,30px)}
.grid{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.door{width:100%;height:100%;min-height:126px;border:1px solid #b28d58;border-radius:10px;background:radial-gradient(ellipse at top,#843a40,#491b28);color:var(--ink);padding:12px 6px;box-shadow:inset 0 0 0 4px #f1c88818;cursor:pointer;font:inherit}
.door.available{background:radial-gradient(ellipse at top,#3e674e,#193e30);border-color:var(--gold)}
.door[aria-disabled=true]{cursor:default}.door.available:hover{filter:brightness(1.2)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.number{display:block;font-size:2.15rem;color:var(--gold);line-height:1.1}
small{display:block;margin-top:3px;color:var(--muted)}
dialog{color:var(--ink);background:#102d22;border:1px solid var(--gold);border-radius:16px;width:min(92vw,550px);max-height:90dvh;text-align:center;padding:20px}
dialog::backdrop{background:#020e0bdf}dialog h2{margin:0 0 12px}
.ornament{display:block;width:100%;height:min(55dvh,460px);object-fit:contain;background:#062719;border-radius:10px}
.close{margin-top:14px;border:0;border-radius:8px;background:var(--gold);color:#302313;padding:9px 18px;font:inherit;font-weight:750;cursor:pointer}
@media(max-width:570px){header{grid-template-columns:1fr auto}.troy{width:clamp(70px,22vw,123px);margin-right:4px}.intro{padding:18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.door{min-height:108px}}
</style>

    document.getElementById('reveal-title').textContent = name;
    ornament.src = art[index];
    ornament.alt = 'Glass Christmas ornament featuring ' + name.toLowerCase();
    openedBy = button;
    dialog.showModal();
  });
  item.append(button);
  document.getElementById('doors').append(item);
  return {button, status, release};
});
function refreshDoors() {
  const current = today();
  for (const {button, status, release} of doors) {
    const available = current >= release;
    button.classList.toggle('available', available);
    button.setAttribute('aria-disabled', String(!available));
    status.textContent = available ? 'Open door' : 'Locked';
  }
}
dialog.addEventListener('close', () => {
  ornament.removeAttribute('src');
  openedBy?.focus();
});
document.addEventListener('visibilitychange', refreshDoors);
window.setInterval(refreshDoors, 1000);
refreshDoors();
</script>
</html>
